<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVAC Pro | 24/7 Automated Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-gradient { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <nav class="bg-white border-b py-4 px-8 flex justify-between items-center sticky top-0 z-50">
        <div class="text-2xl font-black text-slate-900 tracking-tighter">ELITE HVAC</div>
        <a href="tel:5555555555" class="bg-orange-500 text-white px-5 py-2 rounded-full font-bold hover:bg-orange-600 transition">Call Now</a>
    </nav>

    <header class="max-w-6xl mx-auto py-20 px-6 text-center">
        <h1 class="text-5xl md:text-6xl font-extrabold text-slate-900 leading-tight">AC Broken? <span class="text-orange-500">We’ll fix it today.</span></h1>
        <p class="text-lg text-slate-600 mt-6 mb-10 max-w-2xl mx-auto">Get a pro technician at your door without the wait. Use our assistant to book in 60 seconds.</p>
        <button onclick="toggleChat()" class="bg-slate-900 text-white text-lg font-bold py-4 px-10 rounded-xl hover:scale-105 transition-transform shadow-2xl">
            Book Service Now
        </button>
    </header>

    <div id="chat-container" class="fixed bottom-6 right-6 w-96 max-w-[90vw] hidden z-[100] shadow-2xl">
        <div class="bg-white rounded-2xl border overflow-hidden flex flex-col h-[500px]">
            <div class="chat-gradient p-4 text-white flex justify-between items-center">
                <div>
                    <p class="font-bold text-sm text-white">Service Assistant</p>
                    <p class="text-[10px] text-slate-400">Online | Typical reply: Instantly</p>
                </div>
                <button onclick="toggleChat()" class="text-2xl hover:text-orange-500">&times;</button>
            </div>
            <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50 flex flex-col">
                <div class="bg-white border p-3 rounded-lg rounded-tl-none shadow-sm text-sm self-start max-w-[80%]">
                    Hi! I'm the HVAC assistant. Is this an emergency or a routine quote?
                </div>
            </div>
            <div class="p-4 border-t bg-white">
                <form onsubmit="event.preventDefault(); sendMessage();" class="flex gap-2">
                    <input id="user-msg" type="text" placeholder="Type here..." class="flex-1 border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm">
                    <button type="submit" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-bold text-sm">Send</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleChat() {
            const chat = document.getElementById('chat-container');
            chat.classList.toggle('hidden');
        }

        async function sendMessage() {
            const input = document.getElementById('user-msg');
            const box = document.getElementById('chat-box');
            
            if(!input || !input.value) return;
            const userMsg = input.value;
            
            // 1. Show User Message
            box.innerHTML += `<div class="self-end max-w-[80%] bg-slate-900 text-white p-3 rounded-lg rounded-tr-none shadow-sm text-sm">${userMsg}</div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            try {
                // REPLACE THIS URL with your actual hvac-backend Render URL
                const response = await fetch('https://hvac-backend-wxsg.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMsg })
                });

                const data = await response.json();

                // 2. Show AI Response
                box.innerHTML += `<div class="self-start max-w-[80%] bg-white border p-3 rounded-lg rounded-tl-none shadow-sm text-sm">${data.reply}</div>`;
            } catch (error) {
                box.innerHTML += `<div class="self-start text-red-500 text-[10px]">Connecting to AI... try again in 5 seconds.</div>`;
            }
            
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
